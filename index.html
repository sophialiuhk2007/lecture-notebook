<body>
<script>
/* Lecture Notebook — web edition.
   On claude.ai the notebook runs inside an artifact that provides a database, file storage, downloads and Claude.
   On an ordinary website this file stands in for them:
     • notes are kept on this device in the browser's database (IndexedDB) and stay in sync between open tabs;
     • pictures and PDFs are stored there too;
     • Ask Claude / Write a section / Convert handwriting use the visitor's own Anthropic API key (kept only in this browser);
     • "Back up notebook" / "Restore from backup" move everything as one file. */
(function () {
  'use strict';
  if (window.claude) return; // running on claude.ai: use the real thing
  const DBN = 'lecture-notebook';
  const W = window.__web = { version: 1 };
  let idb = null; const mem = new Map(), kids = new Map(), blobs = new Map(), urls = new Map();
  const freeze = (v) => { if (v && typeof v === 'object' && !Object.isFrozen(v)) { Object.freeze(v); for (const k in v) freeze(v[k]); } return v; };
  const parent = (p) => p.slice(0, p.lastIndexOf('/'));
  const index = (p, on) => { const c = parent(p); let s = kids.get(c); if (!s) kids.set(c, s = new Set()); if (on) s.add(p); else s.delete(p); };

  // ---------------------------------------------------------------- IndexedDB
  const openIdb = () => new Promise((res, rej) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs'); if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); });
  const loadAll = () => new Promise(res => {
    const tx = idb.transaction(['docs', 'blobs'], 'readonly');
    const a = tx.objectStore('docs').openCursor(); a.onsuccess = () => { const c = a.result; if (c) { mem.set(c.key, freeze(c.value)); index(c.key, true); c.continue(); } };
    const b = tx.objectStore('blobs').openCursor(); b.onsuccess = () => { const c = b.result; if (c) { blobs.set(c.key, c.value); c.continue(); } };
    tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res();
  });
  const put = (store, k, v) => new Promise((res, rej) => {
    if (!idb) return res();
    const tx = idb.transaction(store, 'readwrite'); const os = tx.objectStore(store); if (v === undefined) os.delete(k); else os.put(v, k);
    tx.oncomplete = () => res(); const fail = () => rej({ code: tx.error && tx.error.name === 'QuotaExceededError' ? 'quota_exceeded' : 'upstream_error', message: String(tx.error || 'write failed') }); tx.onerror = fail; tx.onabort = fail;
  });
  let ready = null;
  const init = () => ready || (ready = (async () => {
    idb = await openIdb(); await loadAll();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if (![...mem.keys()].some(k => /^docs\/[^/]+$/.test(k))) await seed();
  })());

  // ---------------------------------------------------------------- the database the notebook expects (get / set / delete / live listeners)
  const snaps = new Map();
  const docSnap = (p) => { const v = mem.get(p); let s = snaps.get(p); if (!s || s._v !== v) { s = { id: p.slice(p.lastIndexOf('/') + 1), exists: v !== undefined, data: () => v, metadata: { fromCache: false, hasPendingWrites: false }, _v: v }; snaps.set(p, s); } return s; };
  const colSnap = (col) => { const docs = [...(kids.get(col) || [])].map(docSnap); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } }; };
  const subs = new Map(), due = new Set(); let queued = false;
  const notify = (col) => { due.add(col); if (queued) return; queued = true; queueMicrotask(() => { queued = false; const cols = [...due]; due.clear(); for (const c of cols) { const cbs = subs.get(c); if (!cbs || !cbs.size) continue; const s = colSnap(c); for (const cb of [...cbs]) { try { cb(s); } catch (e) { console.error(e); } } } }); };
  const apply = (p, v) => { if (v === undefined) { mem.delete(p); index(p, false); } else { mem.set(p, freeze(v)); index(p, true); } notify(parent(p)); };
  const bc = typeof BroadcastChannel === 'function' ? new BroadcastChannel(DBN) : null; // other tabs of the notebook see changes at once
  if (bc) bc.onmessage = (e) => { const m = e.data || {}; if (m.p) apply(m.p, m.v); if (m.blob) { blobs.set(m.blob, m.data); } if (m.reload) location.reload(); };
  const db = {
    doc: (p) => ({
      async get() { await init(); return docSnap(p); },
      async set(body) { await init(); const v = JSON.parse(JSON.stringify(body)); apply(p, v); await put('docs', p, v); if (bc) bc.postMessage({ p, v }); },
      async delete() { await init(); apply(p, undefined); await put('docs', p, undefined); if (bc) bc.postMessage({ p, v: undefined }); },
    }),
    collection: (col) => ({
      onSnapshot(cb) { let s = subs.get(col); if (!s) subs.set(col, s = new Set()); s.add(cb); init().then(() => { if (s.has(cb)) cb(colSnap(col)); }, () => {}); return () => s.delete(cb); },
      async get() { await init(); return colSnap(col); },
    }),
  };

  // ---------------------------------------------------------------- pictures and PDFs
  window.__blobURL = (id) => { const b = blobs.get(id); if (!b) return null; let u = urls.get(id); if (!u) { u = URL.createObjectURL(b); urls.set(id, u); } return u; };
  const hexId = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x => x.toString(16).padStart(2, '0')).join(''); };
  const assets = {
    async upload(blob, o) { await init(); const id = hexId(); const b = (o && o.type && blob.type !== o.type) ? new Blob([blob], { type: o.type }) : blob; blobs.set(id, b); await put('blobs', id, b); if (bc) bc.postMessage({ blob: id, data: b }); return { id, url: window.__blobURL(id), sizeBytes: b.size }; },
  };

  // ---------------------------------------------------------------- downloads
  const saveFile = (filename, data, type) => { const b = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = filename || 'download'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); };
  const downloads = { async save(r) { saveFile(r.filename, r.data, r.type); return { status: 'saved' }; } };

  // ---------------------------------------------------------------- Claude, with the visitor's own API key
  const KEY = 'nb.web.anthropicKey', MODEL = 'nb.web.model';
  const getKey = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  const API = 'https://api.anthropic.com/v1/';
  const hdrs = (key) => ({ 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' });
  async function listModels(key) { const r = await fetch(API + 'models?limit=100', { headers: hdrs(key) }); if (!r.ok) throw { code: r.status === 401 ? 'bad_key' : 'upstream_error', message: await r.text().catch(() => '') }; const j = await r.json(); return (j.data || []).map(m => ({ id: m.id, name: m.display_name || m.id })); }
  const pickDefault = (ms) => (ms.find(m => /sonnet/i.test(m.id)) || ms.find(m => /opus/i.test(m.id)) || ms[0] || {}).id || '';
  const b64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
  async function sample(input, o) {
    o = o || {};
    let key = getKey(); if (!key) { key = await W.keyDialog(true); if (!key) throw { code: 'not_granted', message: 'No API key' }; }
    let model = ''; try { model = localStorage.getItem(MODEL) || ''; } catch (e) {}
    if (!model) { try { model = pickDefault(await listModels(key)); localStorage.setItem(MODEL, model); } catch (e) { if (e.code === 'bad_key') { W.keyDialog(true); throw { code: 'not_granted' }; } throw { code: 'upstream_error' }; } }
    const msgs = (typeof input === 'string' ? [{ role: 'user', content: input }] : input).map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: [{ type: 'text', text: String(m.content || '') }] }));
    if (o.images && o.images.length) { const last = msgs.filter(m => m.role === 'user').pop(); for (const im of [...o.images].reverse()) { const blob = im instanceof Blob ? im : null; if (!blob) continue; last.content.unshift({ type: 'image', source: { type: 'base64', media_type: /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : 'image/png', data: await b64(blob) } }); } }
    const body = { model, max_tokens: 8192, messages: msgs, stream: !!o.onText };
    let r; try { r = await fetch(API + 'messages', { method: 'POST', headers: hdrs(key), body: JSON.stringify(body), signal: o.signal }); } catch (e) { if (e && e.name === 'AbortError') throw { code: 'aborted' }; throw { code: 'upstream_error', message: 'Network error' }; }
    if (!r.ok) { const t = await r.text().catch(() => ''); if (r.status === 401 || r.status === 403) { W.keyDialog(true, 'That API key was not accepted.'); throw { code: 'not_granted', message: t }; } if (r.status === 404 && /model/i.test(t)) { try { localStorage.removeItem(MODEL); } catch (e) {} } throw { code: r.status === 429 || r.status === 529 ? 'rate_limited' : 'upstream_error', message: t }; }
    if (!o.onText) { const j = await r.json(); const text = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join(''); return { text }; }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', text = '';
    for (;;) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { const ev = buf.slice(0, i); buf = buf.slice(i + 2); const line = ev.split('\n').find(l => l.startsWith('data:')); if (!line) continue; let d; try { d = JSON.parse(line.slice(5)); } catch (e) { continue; }
        if (d.type === 'content_block_delta' && d.delta && d.delta.type === 'text_delta') { text += d.delta.text; try { o.onText({ text, delta: d.delta.text }); } catch (e) {} }
        if (d.type === 'error') throw { code: 'upstream_error', message: (d.error && d.error.message) || '' }; } }
    return { text };
  }

  // ---------------------------------------------------------------- small dialogs (their own styles, so they work before the notebook loads)
  const css = document.createElement('style'); css.textContent = '.wdlg{position:fixed;inset:0;z-index:2000;background:rgba(20,24,30,.35);display:flex;align-items:center;justify-content:center;padding:16px}.wdlg>div{background:var(--panel,#fff);color:var(--ink,#1b2430);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(480px,100%);padding:18px 20px;font:14px/1.5 system-ui,sans-serif}.wdlg h3{margin:0 0 8px;font-size:16px}.wdlg input,.wdlg select{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #c9ced6;border-radius:8px;font:13px ui-monospace,monospace;margin:6px 0}.wdlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}.wdlg button{padding:7px 12px;border-radius:8px;border:1px solid #c9ced6;background:#fff;cursor:pointer;font:13px system-ui}.wdlg button.go{background:#2f5d8a;color:#fff;border-color:#2f5d8a}.wdlg .msg{color:#b3261e;font-size:12.5px;min-height:1em}.wdlg small{color:#667;display:block}';
  document.head.appendChild(css);
  W.keyDialog = (fromCall, note) => new Promise((resolve) => {
    const d = document.createElement('div'); d.className = 'wdlg'; const has = getKey();
    d.innerHTML = '<div role="dialog" aria-label="Claude API key"><h3>✦ Connect Claude</h3><p style="margin:0 0 6px">Ask Claude, Write a section and Convert handwriting use <b>your own</b> Anthropic API key. It is stored only in this browser and sent only to Anthropic. Usage is billed to your API account.</p><small>Get a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com → API keys</a>. A claude.ai subscription cannot be used here.</small><input type="password" placeholder="sk-ant-…" autocomplete="off" value="' + (has ? '••••••••' : '') + '"><select hidden></select><div class="msg">' + (note || '') + '</div><div class="row">' + (has ? '<button data-x="rm">Remove key</button>' : '') + '<button data-x="no">' + (fromCall ? 'Not now' : 'Close') + '</button><button class="go" data-x="ok">Save</button></div></div>';
    document.body.appendChild(d); const inp = d.querySelector('input'), sel = d.querySelector('select'), msg = d.querySelector('.msg');
    const done = (v) => { d.remove(); resolve(v); };
    if (has) listModels(has).then(ms => { sel.innerHTML = ms.map(m => '<option value="' + m.id + '">' + m.name + '</option>').join(''); let cur = ''; try { cur = localStorage.getItem(MODEL) || ''; } catch (e) {} sel.value = cur || pickDefault(ms); sel.hidden = !ms.length; }, () => {});
    inp.addEventListener('focus', () => { if (inp.value.startsWith('••')) inp.value = ''; });
    d.addEventListener('click', async (e) => {
      const x = e.target.closest('[data-x]'); if (!x && e.target === d) return done(null); if (!x) return;
      if (x.dataset.x === 'no') return done(null);
      if (x.dataset.x === 'rm') { try { localStorage.removeItem(KEY); localStorage.removeItem(MODEL); } catch (er) {} return done(null); }
      let k = inp.value.trim(); if (!k || k.startsWith('••')) k = has; if (!k) { msg.textContent = 'Paste a key first.'; return; }
      msg.style.color = '#667'; msg.textContent = 'Checking…';
      try { const ms = await listModels(k); try { localStorage.setItem(KEY, k); localStorage.setItem(MODEL, (!sel.hidden && sel.value) || pickDefault(ms)); } catch (er) {} done(k); }
      catch (er) { msg.style.color = ''; msg.textContent = er.code === 'bad_key' ? 'That key was not accepted.' : 'Couldn’t reach Anthropic — check your connection.'; }
    });
    setTimeout(() => inp.focus(), 30);
  });

  // ---------------------------------------------------------------- whole-notebook backup file
  W.backup = async () => {
    await init(); const out = { app: 'lecture-notebook', v: 1, saved: new Date().toISOString(), docs: {}, blobs: {} };
    for (const [k, v] of mem) out.docs[k] = v;
    for (const [k, b] of blobs) out.blobs[k] = { type: b.type, data: await b64(b) };
    saveFile('lecture-notebook-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(out), 'application/json');
  };
  W.restore = () => {
    const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
    f.onchange = async () => {
      const file = f.files && f.files[0]; if (!file) return; let j; try { j = JSON.parse(await file.text()); } catch (e) { alert('That file isn’t a notebook backup.'); return; }
      if (!j || j.app !== 'lecture-notebook' || !j.docs) { alert('That file isn’t a notebook backup.'); return; }
      const n = Object.keys(j.docs).filter(k => /^docs\/[^/]+$/.test(k)).length;
      if (!confirm('Add the ' + n + ' notes from this backup to this device? Notes with the same name in both are replaced by the backup copy.')) return;
      await init();
      for (const [k, v] of Object.entries(j.docs)) { mem.set(k, freeze(v)); index(k, true); await put('docs', k, v); }
      for (const [k, x] of Object.entries(j.blobs || {})) { const bin = atob(x.data); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); const b = new Blob([a], { type: x.type }); blobs.set(k, b); await put('blobs', k, b); }
      if (bc) bc.postMessage({ reload: 1 }); location.reload();
    };
    f.click();
  };
  W.menu = () => [{ sep: 1 },
    { html: '⤓ Back up whole notebook<small>one file with every note, drawing and picture — keep it safe, or open it on another device</small>', fn: () => W.backup() },
    { html: '⤒ Restore from a backup file', fn: () => W.restore() },
    { html: '✦ Claude API key…<small>' + (getKey() ? 'connected — change or remove' : 'connect your own key for Ask Claude') + '</small>', fn: () => W.keyDialog(false) },
    { html: 'About this web edition<small>notes stay in this browser on this device</small>', fn: () => W.about() }];
  W.about = () => { const d = document.createElement('div'); d.className = 'wdlg'; d.innerHTML = '<div><h3>Lecture Notebook — web edition</h3><p>Your notes are saved in this browser, on this device only. Nothing is uploaded. Clearing this site’s data deletes them, so use <b>Export → Back up whole notebook</b> now and then.</p><p>To move to another device, back up here and choose <b>Restore from a backup file</b> there.</p><p>Claude features use your own Anthropic API key (Export → Claude API key…).</p><div class="row"><button class="go" data-x="no">OK</button></div></div>'; document.body.appendChild(d); d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-x]')) d.remove(); }); };

  // ---------------------------------------------------------------- first visit: two demo notes
  async function seed() {
    const t = new Date().toISOString(); const put2 = async (p, v) => { mem.set(p, freeze(v)); index(p, true); await put('docs', p, v); };
    const d1 = 'demo-welcome', d2 = 'demo-ink';
    await put2('docs/' + d1, { id: d1, title: 'Welcome — try the notebook', course: 'Demo', created: t, updated: t });
    const B = [
      ['h2', 'Typing math the easy way'],
      ['p', 'Write math in plain words and it turns into symbols — for example sum from i=1 to n of x_i or X ~ N(mu, sigma^2). Real LaTeX works too: $\\int_0^1 f(x)\\,dx$.'],
      ['box:def', 'A random vector $X$ is *Multivariate Normal* if $t\'X$ is Normal for every constant vector $t$.', 'Multivariate Normal'],
      ['box:thm', 'The distribution of a random vector $X$ is determined by the distributions of all the linear combinations $t\'X$.', 'Cramér–Wold'],
      ['math', 'Var(t\'X) = t\' Sigma t >= 0'],
      ['p', 'Select some text and press 💬 to comment, or ✦ Claude to ask about it (connect your own API key under Export → Claude API key…).'],
      ['h2', 'Handwriting'],
      ['p', 'Open “Handwriting demo” in the sidebar to write with a stylus or mouse, or press ✎ at the top for scratch paper next to your notes.'],
      ['p', 'Your notes stay in this browser. Use Export → Back up whole notebook to keep a copy or move to another device.'],
    ];
    let pos = 1024; for (const [type, text, title] of B) { const id = 'b' + d1.slice(5) + pos; const b = { id, type: type.startsWith('box:') ? 'box' : type, text, pos, created: t }; if (type.startsWith('box:')) { b.kind = type.slice(4); b.title = title; } if (pos === 1024 * 6) b.comments = [{ id: 'c1', quote: 'comment', text: 'Comments sit in the margin. Reply, resolve, or ask Claude from here.', who: 'me', created: t, replies: [] }]; await put2('docs/' + d1 + '/blocks/' + id, b); pos += 1024; }
    await put2('docs/' + d2, { id: d2, title: 'Handwriting demo', course: 'Demo', created: t, updated: t, kind: 'ink', bg: 'lines' });
    await put2('docs/' + d2 + '/blocks/bink1', { id: 'bink1', type: 'page', text: '', pos: 1024, created: t, ink: { w: 850, h: 1100, bg: 'lines', strokes: [], shapes: [] } });
    try { localStorage.setItem('nb.last', d1); } catch (e) {}
  }

  // ---------------------------------------------------------------- what the notebook asks for
  window.claude = { web: true, use: async (name) => {
    if (name === 'db') { try { await init(); return db; } catch (e) { console.warn('Browser storage unavailable; notes will not be saved', e); return null; } }
    if (name === 'assets') { try { await init(); return assets; } catch (e) { return null; } }
    if (name === 'downloads') return downloads;
    if (name === 'sample') return sample;

}

// ---------------------------------------------------------------- let Claude read the course readings (whole PDFs, searched page by page)
// Triggered by words like "book", "reading", "appendix", "chapter 8", "p. 114", or a #tag (#book, #reading, or a word from a reading's title).
const Books = {
  text: {},
  STOP: new Set('the and for with that this what does from have into about which there their then than they them when where your you are was were how why can could would should will just also only some more most such each other these those over under onto its it’s isn’t don’t check look see book textbook reading readings please explain mean means meaning page pages chapter section appendix draft notes lecture'.split(' ')),
  async list() {
    const key = Panel.slug(Panel.curCourse());
    let rs = Panel._loaded === key ? Panel.readings : null;
    if (!rs) { try { if (Store.mode === 'db') { const d = await Store.db.doc('courses/' + key).get(); rs = (d.exists && plainData(d).readings) || []; } else rs = JSON.parse(lsGet('nb.read.' + key) || '[]'); } catch (e) { rs = []; } }

  pages(r) {

      const buf = await (await fetch(BLOB(r.asset))).arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise; const out = [];
      for (let i = 1; i <= pdf.numPages; i++) { const tc = await (await pdf.getPage(i)).getTextContent(); out.push(tc.items.map(it => (it.str || '') + (it.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ')); }

  },
  wants(q) { q = String(q || ''); return /\b(books?|textbook|readings?|appendix|chapter|ch\.\s?\d|section\s+[A-Z]?\d|draft|the text)\b/i.test(q) || /\b(page|p\.|pp\.)\s?\d/i.test(q) || /(^|\s)#[A-Za-z]/.test(q) || /§/.test(q); },
  pick(rs, q) {
    const ql = q.toLowerCase(); const tags = (q.match(/#([A-Za-z][\w-]*)/g) || []).map(t => t.slice(1).toLowerCase()).filter(t => !/^(book|books|reading|readings|text|textbook)$/.test(t));
    const words = r => String(r.title || '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !this.STOP.has(w));
    let hit = rs.filter(r => tags.some(t => String(r.title || '').toLowerCase().replace(/[^a-z0-9]+/g, '').includes(t.replace(/[^a-z0-9]+/g, ''))));
    if (!hit.length) hit = rs.filter(r => words(r).some(w => new RegExp('\\b' + w + '\\b').test(ql)));
    if (!hit.length && /\bbook|textbook|draft\b/.test(ql)) hit = rs.filter(r => /book|draft|text/i.test(r.title || ''));
    return hit.length ? hit : rs;
  },
  terms(s) { return (String(s || '').toLowerCase().match(/[a-z][a-z0-9’'-]{2,}/g) || []).filter(w => !this.STOP.has(w)); },
  // the most relevant pages of the chosen readings, as text for the prompt
  async prompt(q, extra) {
    const all = await this.list();
    if (!all.length) return '\n\n(The student asked about the readings, but no PDFs are added to Readings for this course yet. Tell them to add the book in 📖 Readings so you can read it.)';
    const rs = this.pick(all, q); const docs = [];
    for (const r of rs) { try { docs.push({ r, pages: await this.pages(r) }); } catch (e) {} }
    if (!docs.length) return '\n\n(The readings could not be opened just now.)';
    const BUDGET = 45000; const total = docs.reduce((a, d) => a + d.pages.join('').length, 0);
    let chosen = [];
    if (total <= BUDGET) docs.forEach((d, di) => d.pages.forEach((t, i) => chosen.push([di, i])));
    else {
      const qt = this.terms(q), et = this.terms(extra).slice(0, 60); const w = {}; qt.forEach(t => w[t] = (w[t] || 0) + 2); et.forEach(t => w[t] = (w[t] || 0) + 0.5);
      const secs = (q.match(/\b[A-Z]?\d+(?:\.\d+)+\b/g) || []);
      const pg = (q.match(/\b(?:page|p\.|pp\.)\s?(\d{1,4})/gi) || []).map(x => +x.match(/\d+/)[0]);
      const heads = (q.match(/\b(?:chapter|appendix)\s+([A-Z]|\d+)\b/gi) || []).map(x => x.split(/\s+/).pop());

      const add = p => { if (!p || pick.has(key(p)) || used + p.t.length > BUDGET) return; pick.set(key(p), p); used += p.t.length; };
      const at = (di, i) => flat.find(p => p.di === di && p.i === i);
      top.slice(0, 3).forEach(p => { add(p); add(at(p.di, p.i + 1)); add(at(p.di, p.i - 1)); });
      for (const p of top) { if (used > BUDGET - 500) break; add(p); }

      if (!chosen.length) chosen = docs[0].pages.slice(0, 6).map((t, i) => [0, i]);
    }
    let s = '\n\nThe student is asking you to use the course reading' + (docs.length > 1 ? 's' : '') + ': ' + docs.map(d => '“' + d.r.title + '” (' + d.pages.length + ' pages)').join(', ') + '. ' +
      (total <= BUDGET ? 'Here is the full text.' : 'The pages of the whole PDF most relevant to the question were found and are given below.') +
      ' Base your answer on it, quote or paraphrase it faithfully, and say which page / section you used (printed page numbers or section numbers as they appear in the text). If the answer is not in these pages, say so.\n';
    let cur = -1;
    for (const [di, i] of chosen) { if (di !== cur) { s += '\n=== ' + docs[di].r.title + ' ===\n'; cur = di; } s += '\n[PDF page ' + (i + 1) + ']\n' + docs[di].pages[i].trim() + '\n'; }
    return s;
  }
};

const LBL = (id) => 'b:' + id;

      const head = (K.num ? K.label + ' ' + n.num : K.label) + (b.title ? ' \\ \\textnormal{(' + inl(b.title, ctx) + ')}' : '');
      const heavy = ['def', 'thm', 'prop', 'lem', 'cor', 'conj'].includes(b.kind);

  want('amssymb', /\\mathbb|\\mathfrak|\\geqslant|\\leqslant|\\varnothing/.test(body));
  want('amsthm', /\\begin\{(proof|nb)/.test(body));
  want('enumitem', /\\begin\{(itemize|enumerate)\}\[/.test(body));
  want('graphicx', /\\includegraphics/.test(body));
  want('booktabs', /\\(toprule|midrule|bottomrule)/.test(body));
  want('listings', /\\begin\{lstlisting\}/.test(body) || !opt.plain);
  want('xcolor', /\\(textcolor|color|colorbox)\b|nb[a-z]+!/.test(body) || !opt.plain);
  want('soul', /\\hl\b|\\hlc\b/.test(body) || !opt.plain);
  want('ulem', /\\uline/.test(body), 'normalem');
  want('tikz', /\\begin\{tikzpicture\}/.test(body));
  want('tcolorbox', !opt.plain, 'most');
  want('hyperref', /\\hyperref|\\href|\\phantomsection/.test(body));
  if (/\\begin\{tikzpicture\}/.test(body)) need.push('\\usetikzlibrary{arrows.meta}');
  // the notebook's own shorthands, only where the file doesn't define them
  const lines = TEX_PRE.split('\n');
  const prov = lines.filter(l => /^\\newcommand|^\\providecommand/.test(l)).map(l => l.replace(/\\newcommand/g, '\\providecommand'));
  const style = opt.plain ? [] : lines.filter(l => /^\\(definecolor|colorlet|newtcolorbox|soulregister|lstset)/.test(l));
  return '% ---- added by Lecture Notebook\n' + need.concat(prov, style).join('\n') + '\n' + (opt.plain ? texPlainDefs() : '');
}
function docLatex(opt) {
  opt = opt || {};
  const m = state.docs.get(state.docId) || {};
  computeNums();
  state.minH = Math.min(4, ...ordered().filter(b => /^h[123]$/.test(b.type)).map(b => +b.type[1]));
  const T = m.tex && m.tex.pre ? m.tex : null;
  let body = '';
  for (const b of ordered()) {
    if (opt.noAsides && b.aside) continue;
    let out;
    if (T && (b.tex != null || b.texPart) && b.texSig === texSigOf(b)) out = b.texPart ? '' : b.tex;
    else out = blockLatex(b, opt);
    const pre = T && b.texPre ? b.texPre : '';
    if (pre) body += pre + '\n\n';
    if (out) body += out + '\n\n';
  }
  if (T) return T.pre.replace(/\s+$/, '') + '\n' + texCompat(T.pre, body, opt) + '\n\\begin{document}\n\n' + body + (T.post ? T.post + '\n\n' : '') + '\\end{document}\n';
  let t = TEX_PRE + (opt.plain ? texPlainDefs() : '') + '\\title{' + inl(m.title || 'Notes', texCtx()) + '}\\author{' + inl(m.course || '', texCtx()) + '}\\date{' + new Date(m.updated || Date.now()).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + '}\n\\begin{document}\n\\maketitle\n\n';
  return t + body + '\\end{document}\n';
}
async function saveFile(name, data) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (!dl) { toast('Downloads aren’t available in this view — use Copy LaTeX.'); return; }
  try { await dl.save({ filename: name, data }); toast('Saved ' + name); } catch (e) { if (e && e.code !== 'declined') toast('Couldn’t save the file.'); }
}
async function exportZip(opt) {
  const zip = new JSZip(); const ext = {};
  for (const b of ordered()) {
    try {
      if (b.type === 'image' && b.img && (b.img.asset || b.img.data)) { const blob = await (await fetch(imgSrc(b.img))).blob(); ext[b.id] = blob.type === 'image/jpeg' ? '.jpg' : '.png'; zip.file('images/' + b.id + ext[b.id], blob); }
      if (b.type === 'ink' && Ink.has(b.ink) && !(b.ink.shapes || []).length) { zip.file('images/' + b.id + '.png', await Ink.png(b.ink, 2)); ext[b.id] = '.png'; }
      if (b.type === 'page' && Ink.has(b.ink)) { zip.file('images/' + b.id + '.png', await Ink.png(b.ink, 2, { keepBg: true })); }
    } catch (e) {}
  }
  const m = state.docs.get(state.docId) || {};
  zip.file('notes.tex', docLatex(Object.assign({ ext }, opt || {})));
  zip.file('notebook.json', JSON.stringify({ meta: clone(m), blocks: ordered().map(b => clone(b)) }, null, 1));
  zip.file('README.txt', 'Compile notes.tex with pdflatex (twice, for references) — e.g. upload the whole folder to Overleaf.\n');
  const blob = await zip.generateAsync({ type: 'blob' });
  await saveFile(((m.title || 'notes').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'notes') + '_latex.zip', blob);
}
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); toast(msg || 'Copied'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg || 'Copied'); } catch (e2) { toast('Couldn’t copy'); } ta.remove(); }
}
$('exportBtn').onclick = () => {
  openMenu($('exportBtn'), [

    { html: 'Download LaTeX (.zip)<small>notes.tex + images</small>', fn: () => exportZip() },

    { html: 'Copy LaTeX for handing in', fn: () => copyText(docLatex({ plain: true, noAsides: true, comments: false, marks: false }), 'LaTeX copied — paste into Overleaf') },

// drag the left edge of the right panel to resize it (width remembered per browser)
(function () {
  const body = document.querySelector('.body'), g = $('rgrip'); if (!g || !body) return;
  const maxW = () => Math.max(320, window.innerWidth - (body.classList.contains('sidehidden') ? 0 : 260) - 380);
  const setW = (w, save) => { if (!w) { body.style.removeProperty('--rpw'); if (save) lsSet('nb.rpw', ''); }
    else { w = Math.round(Math.max(300, Math.min(maxW(), w))); body.style.setProperty('--rpw', w + 'px'); if (save) lsSet('nb.rpw', w); } };
  const saved = +(lsGet('nb.rpw') || 0); if (saved) setW(saved);
  let drag = null;
  g.addEventListener('pointerdown', e => { if (e.button) return; e.preventDefault(); g.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, w: $('rpanel').getBoundingClientRect().width }; g.classList.add('on'); document.body.classList.add('rpdrag'); });
  g.addEventListener('pointermove', e => { if (!drag) return; setW(drag.w + (drag.x - e.clientX)); });
  const end = () => { if (!drag) return; drag = null; g.classList.remove('on'); document.body.classList.remove('rpdrag');
    const v = body.style.getPropertyValue('--rpw'); if (v) lsSet('nb.rpw', parseInt(v)); setTimeout(layoutCmts, 50); };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  g.addEventListener('dblclick', () => { setW(0, true); setTimeout(layoutCmts, 50); });
  window.addEventListener('resize', () => { const v = parseInt(body.style.getPropertyValue('--rpw')); if (v && v > maxW()) setW(v); });
})();

// ---------------------------------------------------------------- boot
async function boot() {
  await Store.init(); setSave('ok'); Drive.init();
  let first = true;
  Store.watchDocs((list, meta) => {
    const cur = state.docs.get(state.docId);
    state.docs = new Map(list.filter(d => d && d.id).map(d => [d.id, JSON.parse(JSON.stringify(d))]));
    if (cur && state.docs.has(cur.id) && document.activeElement === $('dtitle')) state.docs.get(cur.id).title = cur.title;
    renderSide();
    if (first && !meta.fromCache) {
      first = false;
      const last = lsGet('nb.last'); const live = liveDocs();
      const pick = (last && state.docs.has(last) && !state.docs.get(last).trashed) ? last : (live[0] && live[0].id);
      if (pick) openDoc(pick); else newDoc('', { blank: true });
    }
  });
}
